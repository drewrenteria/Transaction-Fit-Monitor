name: Rebuild dashboard

on:
  schedule:
    - cron: "17 11 * * *"      # daily, deliberately off the hour
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::jsonlite
            any::dplyr
            any::purrr
            any::tibble
            any::httr2

      - name: Build
        run: Rscript build.R

      - name: Publish to Pages folder
        run: |
          mkdir -p docs
          cp output/transaction_fit_dashboard.html docs/index.html

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Daily rebuild"
          file_pattern: docs/index.html
